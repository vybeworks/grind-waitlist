<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set New Password — GRIND</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Oswald:wght@500;600;700&display=swap');
  :root {
    --bg: #0D0F16; --card: #14161F; --card-border: #262A38;
    --ember-2: #E8A33D; --rose: #E85A6E; --teal: #4FD1C5;
    --text: #EDEAE3; --text-dim: #8B8F9E; --text-dimmer: #4B4F5C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px;
  }
  .logo { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.18em; margin-bottom: 32px; }
  .card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 20px;
    padding: 36px; max-width: 400px; width: 100%; text-align: center;
  }
  h1 { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 600; margin-bottom: 10px; }
  p.sub { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
  form { display: flex; flex-direction: column; gap: 12px; }
  .pw-wrap { position: relative; }
  input {
    background: var(--bg); border: 1px solid var(--card-border); border-radius: 10px;
    padding: 14px 16px; color: var(--text); font-size: 15px; font-family: inherit; width: 100%;
  }
  .pw-wrap input { padding-right: 44px; }
  input:focus { outline: none; border-color: var(--ember-2); }
  .pw-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 4px;
    font-size: 13px; color: var(--text-dimmer); width: auto;
  }
  .pw-toggle:hover { color: var(--ember-2); transform: translateY(-50%); }
  .pw-hint { font-size: 11px; color: var(--text-dimmer); text-align: left; margin: -4px 0 2px; line-height: 1.5; }
  .pw-hint .met { color: var(--teal); }
  button {
    background: linear-gradient(90deg, var(--ember-2), var(--rose));
    border: none; border-radius: 10px; padding: 14px 24px;
    color: #12141C; font-weight: 700; font-size: 15px; cursor: pointer;
    transition: transform 0.15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: 0.6; cursor: default; transform: none; }
  .status-msg { font-size: 13px; min-height: 18px; margin-top: 4px; }
  .status-msg.ok { color: var(--teal); }
  .status-msg.err { color: var(--rose); }
  .back { color: var(--text-dimmer); font-size: 13px; margin-top: 20px; display: inline-block; text-decoration: none; }
  .back:hover { color: var(--ember-2); }
</style>
</head>
<body>
  <div class="logo">GRIND</div>
  <div class="card" id="card">
    <p>Verifying reset link...</p>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      "https://uksdcyoxjvpmjsqqwdjj.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrc2RjeW94anZwbWpzcXF3ZGpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NzgyNTQsImV4cCI6MjEwMDQ1NDI1NH0.l0VYdiYFfd16pQGHtENTTBYtlNvcxYJXtXqMaQVxAVI"
    );

    const card = document.getElementById('card');

    function isStrongPassword(pw) {
      return pw.length >= 8 && /[A-Z]/.test(pw) && /[0-9]/.test(pw);
    }

    function showForm() {
      card.innerHTML = `
        <h1>Set a new password</h1>
        <p class="sub">Choose a new password for your account.</p>
        <form id="updateForm">
          <div class="pw-wrap">
            <input type="password" id="passwordInput" placeholder="new password" required />
            <button type="button" class="pw-toggle" id="pwToggle">Show</button>
          </div>
          <div class="pw-hint" id="pwHint">At least 8 characters, one uppercase letter, and one number</div>
          <input type="password" id="confirmInput" placeholder="confirm new password" required />
          <button type="submit" id="submitBtn">Update password</button>
        </form>
        <div class="status-msg" id="statusMsg"></div>
      `;

      const pwInput = document.getElementById('passwordInput');
      const pwHint = document.getElementById('pwHint');
      document.getElementById('pwToggle').addEventListener('click', (e) => {
        const isHidden = pwInput.type === 'password';
        pwInput.type = isHidden ? 'text' : 'password';
        e.target.textContent = isHidden ? 'Hide' : 'Show';
      });
      pwInput.addEventListener('input', (e) => {
        const pw = e.target.value;
        const lenOk = pw.length >= 8, upperOk = /[A-Z]/.test(pw), numOk = /[0-9]/.test(pw);
        pwHint.innerHTML = `<span class="${lenOk ? 'met' : ''}">8+ characters</span> · <span class="${upperOk ? 'met' : ''}">1 uppercase</span> · <span class="${numOk ? 'met' : ''}">1 number</span>`;
      });

      document.getElementById('updateForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('passwordInput').value;
        const confirm = document.getElementById('confirmInput').value;
        const statusEl = document.getElementById('statusMsg');
        const btn = document.getElementById('submitBtn');

        if (!isStrongPassword(password)) {
          statusEl.textContent = 'Password needs 8+ characters, one uppercase letter, and one number';
          statusEl.className = 'status-msg err';
          return;
        }
        if (password !== confirm) {
          statusEl.textContent = "Passwords don't match";
          statusEl.className = 'status-msg err';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Updating...';

        const { error } = await supabase.auth.updateUser({ password });

        if (error) {
          statusEl.textContent = 'Something went wrong — try requesting a new reset link.';
          statusEl.className = 'status-msg err';
          btn.disabled = false;
          btn.textContent = 'Update password';
          return;
        }

        statusEl.textContent = 'Password updated! Redirecting to sign in...';
        statusEl.className = 'status-msg ok';
        setTimeout(() => {
          supabase.auth.signOut().then(() => { window.location.href = 'signin.html'; });
        }, 1200);
      });
    }

    function showInvalidLink() {
      card.innerHTML = `
        <h1>Reset link expired or invalid</h1>
        <p class="sub">This link may have already been used, or has expired. Request a new one.</p>
        <a href="forgot-password.html" style="color: var(--ember-2);">Request a new reset link</a>
      `;
    }

    // A password-recovery link establishes a temporary session, same
    // mechanism as the email-confirmation and magic-link flows — checked
    // the same robust way (state-change listener + immediate check + timeout).
    let resolved = false;
    supabase.auth.onAuthStateChange((event, session) => {
      if (resolved) return;
      if (session) { resolved = true; showForm(); }
    });
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (resolved) return;
      if (session) { resolved = true; showForm(); }
    });
    setTimeout(() => {
      if (!resolved) { resolved = true; showInvalidLink(); }
    }, 4000);
  </script>
</body>
</html>
